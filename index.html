<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riverdale Apartment - KUMASI</title>
<style>
:root{--blue:#2046f5;--line:#e5e7eb;--slate:#64748b;--bg:#f8fafc}
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:var(--bg)}
.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;background:url('bg_optimized.jpg') center/cover;padding:16px}
.login-card{background:#fff;width:100%;max-width:380px;padding:24px;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.tab{display:flex;gap:8px;background:#f1f5f9;padding:6px;border-radius:12px;margin:12px 0}
.tab button{flex:1;padding:10px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
.tab button.active{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1);color:var(--blue)}
input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin:6px 0 12px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:#fff;border-right:1.5px solid var(--line);padding:16px}
.topbar{background:#fff;border-bottom:1.5px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px}
.room{border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff}
.room.sel{border-color:var(--blue);box-shadow:0 0 0 2px rgba(32,70,245,.2)}
.badge{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}
.bg-green{background:#dcfce7;color:#166534}.bg-orange{background:#ffedd5;color:#9a3412}.bg-blue{background:#dbeafe;color:#1e40af}
.kpi .val{font-size:24px;font-weight:800}
.chat-float{position:fixed;right:16px;bottom:70px;display:flex;flex-direction:column;gap:10px}
.chat-float div{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}

/* MOBILE PERFECT FIT + SMALL TEXT */
@media(max-width:768px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;display:flex;overflow:auto;z-index:30;padding:8px;gap:8px}
  .topbar span{font-size:12px!important}
  h1{font-size:20px!important;line-height:1.25!important;word-break:break-word}
  #p-dash h1{font-size:20px!important}
  #p-dash > p{font-size:11px!important}
  #p-dash div[style*="repeat(4"]{grid-template-columns:1fr 1fr!important;gap:10px!important}
  .kpi{padding:12px!important}
  .kpi h3{font-size:12px!important}
  .kpi .val{font-size:18px!important}
  .login-wrap{padding:12px;min-height:100dvh}
  .login-card{max-width:92%;padding:20px;border-radius:20px}
  #loginScreen ~ .chat-float{display:none!important}
}
</style></head>
<body>
<div id="loginScreen" class="login-wrap"><div class="login-card">
<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><div style="width:36px;height:36px;background:var(--blue);border-radius:10px"></div><div><b>Riverdale Apartment</b><div style="font-size:12px;color:var(--blue);font-weight:700">KUMASI • GHANA</div></div></div>
<h2 style="margin:10px 0">Sign in</h2>
<div class="tab"><button id="tGuest" class="active" onclick="switchTab('guest')">Guest</button><button id="tAdmin" onclick="switchTab('admin')">Admin</button></div>
<div id="guestForm"><label style="font-size:12px;font-weight:700">Gmail *</label><input id="gEmail" value="Anthony"><label style="font-size:12px;font-weight:700">Full Name *</label><input id="gName" value="Appiah"><button class="btn" onclick="loginGuest()">Continue</button></div>
<div id="adminForm" class="hidden"><label style="font-size:12px;font-weight:700">Admin Email</label><input id="aEmail" value="admin@riverdale.com"><label style="font-size:12px;font-weight:700">Password</label><input id="aPass" type="password" value="admin123"><button class="btn" onclick="loginAdmin()">Sign in as Admin</button></div>
</div></div>

<div id="appScreen" class="hidden"><div class="app">
<div class="sidebar"><b>Riverdale</b><br><br>
<button onclick="nav('dash')" style="width:100%;text-align:left;padding:10px;border:0;background:#eef2ff;border-radius:10px">Dashboard</button>
<button onclick="nav('rooms')" style="width:100%;text-align:left;padding:10px;border:0;background:transparent;border-radius:10px">Rooms</button>
<button onclick="logout()" style="width:100%;text-align:left;padding:10px;border:0;background:transparent;border-radius:10px;margin-top:20px">Logout</button>
</div>
<div><div class="topbar"><span id="welcome">Welcome</span><span id="roleBadge" class="badge bg-blue">Guest</span></div>
<div style="padding:16px">
<div id="p-dash"><h1>Admin Dashboard — Documents & Check-Ins | Reviews | Chats</h1><p style="color:var(--slate);font-size:13px">Overview of your apartments</p>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px"><div class="card kpi"><h3>Check-Ins</h3><div class="val">12</div></div><div class="card kpi"><h3>Documents</h3><div class="val">8</div></div><div class="card kpi"><h3>Reviews</h3><div class="val">24</div></div><div class="card kpi"><h3>Chats</h3><div class="val">5</div></div></div></div>
<div id="p-rooms" class="hidden"><h1>Rooms</h1><div id="roomGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px"></div><div id="roomsPage" style="display:none"></div></div>
</div></div></div></div>

<div class="chat-float" style="display:none"><div style="background:var(--blue)">C</div><div style="background:#22c55e">W</div></div>

<script>
let currentRole='guest';let selRoom=null;
const rooms=[{id:'A-101',name:'A-101',type:'Studio',cap:2,price:120,status:'Available'},{id:'A-102',name:'A-102',type:'1 Bed',cap:3,price:180,status:'Available'},{id:'B-201',name:'B-201',type:'2 Bed',cap:4,price:250,status:'Occupied'},{id:'B-202',name:'B-202',type:'Studio',cap:2,price:130,status:'Cleaning'}];

// FIXED STORAGE - no duplicate let
let roomsStore=[];
try{const s=localStorage.getItem('rd_rooms');roomsStore=s?JSON.parse(s):JSON.parse(JSON.stringify(rooms))}catch(e){roomsStore=JSON.parse(JSON.stringify(rooms))}
function saveRooms(){localStorage.setItem('rd_rooms',JSON.stringify(roomsStore))}

function switchTab(t){currentRole=t;document.getElementById('tGuest').classList.toggle('active',t==='guest');document.getElementById('tAdmin').classList.toggle('active',t==='admin');document.getElementById('guestForm').classList.toggle('hidden',t!=='guest');document.getElementById('adminForm').classList.toggle('hidden',t!=='admin')}
function loginGuest(){currentRole='guest';document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appScreen').classList.remove('hidden');document.getElementById('roleBadge').textContent='Guest';document.querySelector('.chat-float').style.display='flex';renderRooms()}
function loginAdmin(){if(document.getElementById('aEmail').value!=='admin@riverdale.com'||document.getElementById('aPass').value!=='admin123'){alert('Wrong admin credentials');return}currentRole='admin';document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appScreen').classList.remove('hidden');document.getElementById('roleBadge').textContent='Admin';document.querySelector('.chat-float').style.display='flex';renderRooms()}
function logout(){document.getElementById('appScreen').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');document.querySelector('.chat-float').style.display='none'}
function nav(p){document.getElementById('p-dash').classList.toggle('hidden',p!=='dash');document.getElementById('p-rooms').classList.toggle('hidden',p!=='rooms')}
function pick(id){selRoom=id;renderRooms()}
function renderRooms(){
  const g=document.getElementById('roomGrid');
  const html=roomsStore.map(r=>{
    const color=r.status==='Available'?'bg-green':r.status==='Occupied'?'bg-orange':'bg-blue';
    const adminControl=currentRole==='admin'?`<select onchange="changeStatus(event,'${r.id}',this.value)" onclick="event.stopPropagation()" style="margin-top:8px;width:100%;padding:8px;border-radius:8px;border:1.5px solid #e5e7eb;font-weight:700;font-size:12px"><option ${r.status==='Available'?'selected':''}>Available</option><option ${r.status==='Occupied'?'selected':''}>Occupied</option><option ${r.status==='Cleaning'?'selected':''}>Cleaning</option></select>`:`<span class="badge ${color}" style="margin-top:8px;display:inline-block">${r.status}</span>`;
    return `<div class="room ${selRoom===r.id?'sel':''}" onclick="${currentRole==='guest'?`pick('${r.id}')`:''}"><div style="display:flex;justify-content:space-between"><b>${r.name}</b><span class="badge ${color}">${r.status}</span></div><div style="font-size:12px;color:var(--slate)">${r.type} • Max ${r.cap}</div><div style="font-weight:800;color:var(--blue)">$${r.price}/night</div>${adminControl}</div>`
  }).join('');
  if(g) g.innerHTML=html;
}
function changeStatus(e,id,newStatus){if(e) e.stopPropagation();const r=roomsStore.find(x=>x.id===id);if(r){r.status=newStatus;saveRooms();renderRooms()}}
</script>
</body></html>

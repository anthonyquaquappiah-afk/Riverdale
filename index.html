<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riverdale Apartment - QR Verified</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--blue:#0E3CE1;--blue-10:#EFF2FF;--white:#fff;--line:#E6E9F0;--slate:#6B7280;--dark:#111827;--muted:#F9FAFB;--r:16px;--shadow:0 8px 24px rgba(14,60,225,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#F6F7FB;color:var(--dark)}
h1,h2,h3{font-family:Manrope,sans-serif}
.app{display:flex;min-height:100vh}
.sidebar{width:280px;background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.brand{padding:22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.brand-mark{width:40px;height:40px;background:var(--dark);border-radius:10px;display:grid;place-items:center;color:white}
.nav{padding:16px 12px;flex:1;overflow:auto}
.nav-sec{font-size:10px;letter-spacing:.12em;color:#9CA3AF;font-weight:700;margin:20px 10px 8px;text-transform:uppercase}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;border:1px solid transparent;background:transparent;text-align:left;font-size:13.5px;font-weight:500;cursor:pointer;color:#374151}
.nav-btn i,.nav-btn svg{pointer-events:none;width:18px;height:18px}
.nav-btn.active{background:var(--dark);color:white}
.nav-btn:hover:not(.active){background:var(--muted);border-color:var(--line)}
.main{flex:1;min-width:0}
.topbar{height:64px;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:30}
.pill{padding:6px 10px;border-radius:999px;background:var(--blue-10);color:var(--blue);font-size:11px;font-weight:700;border:1px solid #DBE3FF}
.content{padding:28px;max-width:1340px;margin:0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.kpi{display:flex;justify-content:space-between}.kpi h3{font-size:12px;color:var(--slate);font-weight:600;margin-bottom:6px}.kpi .val{font-size:26px;font-weight:800}
.badge{font-size:11px;padding:5px 10px;border-radius:999px;font-weight:700;border:1px solid var(--line)}.bg-green{background:#ECFDF5;color:#065F46}.bg-blue{background:var(--blue-10);color:var(--blue)}.bg-orange{background:#FFFBEB;color:#92400E}
.stepper{display:flex;gap:8px;margin-bottom:20px;overflow:auto}.step{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:white;white-space:nowrap;font-size:12px;font-weight:600;color:var(--slate)}
.step.active{background:var(--dark);color:white;border-color:var(--dark)}.step.done{background:var(--blue-10);color:var(--blue);border-color:var(--blue)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.lbl{font-size:12px;font-weight:600;margin-bottom:6px;display:block;color:#374151}
.inp,.sel,.ta{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:13.5px;background:white;outline:none}.inp:focus,.sel:focus,.ta:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-10)}.ta{resize:vertical;min-height:90px}
.upload{border:1.5px dashed #C7D2FE;border-radius:14px;padding:26px;text-align:center;background:var(--blue-10);cursor:pointer}
.prev-wrap{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.prev{width:136px;height:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative}.prev img{width:100%;height:100%;object-fit:cover}.prev .x{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(17,24,39,.7);color:white;border:none;cursor:pointer}
.btn{padding:12px 18px;border-radius:12px;border:none;font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}.btn-p{background:var(--dark);color:white}.btn-g{background:white;border:1px solid var(--line);color:var(--dark)}
.actions{display:flex;justify-content:space-between;margin-top:22px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{font-size:11px;text-transform:uppercase;color:var(--slate);font-weight:700;text-align:left;padding:12px;border-bottom:1px solid var(--line);background:#F9FAFB}.tbl td{padding:12px;border-bottom:1px solid var(--line)}
.room{padding:16px;border:1px solid var(--line);border-radius:14px;background:white;cursor:pointer}.room.sel{border-color:var(--dark);background:#F9FAFB}
.review{background:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:16px}.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}.kv span:first-child{color:var(--slate)}.kv span:last-child{font-weight:600}
.ref{font-family:monospace;font-size:18px;letter-spacing:.12em;background:var(--dark);color:white;padding:10px 16px;border-radius:10px;display:inline-block}
.qr-box{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:16px;padding:16px;background:white;border:1px solid var(--line);border-radius:14px}
.login-wrap{min-height:100vh;display:grid;place-items:center;background:#F6F7FB;padding:20px}
.login-card{width:100%;max-width:420px;background:white;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 20px 60px rgba(17,24,39,.08)}
.login-tabs{display:flex;background:var(--muted);border-radius:12px;padding:4px;gap:4px;margin-bottom:20px}.login-tab{flex:1;padding:10px;border-radius:9px;border:none;background:transparent;font-weight:700;font-size:13px;cursor:pointer}.login-tab.active{background:white;box-shadow:0 2px 8px rgba(0,0,0,.06);border:1px solid var(--line)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:35;display:none}.backdrop.show{display:block}
.mob{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:white;cursor:pointer;display:none}

/* === REAL MOBILE FIX === */
@media(max-width:1024px){.sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.3s}.sidebar.open{transform:translateX(0)}.grid4{grid-template-columns:1fr 1fr}.form-grid,.grid2{grid-template-columns:1fr}.mob{display:grid;place-items:center}}
@media(max-width:640px){
  .topbar{padding:0 12px;height:56px}
  .topbar span[style*="font-weight:800"]{font-size:14px}
  #modePill,#clk{display:none !important}
  .topbar .btn{padding:8px 12px;font-size:12px}
  .content{padding:14px 12px}
  .card{padding:14px;border-radius:14px}
  .stepper{padding-bottom:4px;margin-bottom:14px}
  .step{padding:7px 12px;font-size:11px}
  h1{font-size:22px !important}
  .grid4{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .val{font-size:20px}
  .qr-box{flex-direction:column;align-items:stretch}
  .qr-box #qrCode,.qr-box #qrReceipt{display:grid;place-items:center}
  .ref{font-size:14px;padding:8px 12px}
  .actions{flex-wrap:wrap;gap:10px}
  .tbl{font-size:12px}
  .tbl th,.tbl td{padding:8px}
}

.hidden{display:none !important}
</style>
</head>
<body>
